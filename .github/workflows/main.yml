name: Build Practice Bot

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: unzip -o *.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        run: |
          DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -n 1)")
          echo "Building in: $DIR"
          cd "$DIR"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp $(ls build/libs/*.jar | grep -v sources) "$GITHUB_WORKSPACE/out/"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: PracticeBot
          path: out/*.jar
